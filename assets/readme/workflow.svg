<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Как работает course-builder</title>
  <desc id="desc">Сборка курса за пять этапов: старт, интервью, источники (канон и поле), программа, блокнот NotebookLM. Затем цикл учёбы в каждой сессии: повторы, попытка, теория, практика, разбор, припоминание; вопросы возвращаются в очередь повторов. Сверху — сдача, защита, тест раз в три недели, обновление поля и ретро.</desc>

  <rect width="1200" height="610" rx="28" fill="#F6F1E7"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="56" y="78" font-size="40" font-weight="700" fill="#1E1B16">Как это работает</text>

    <!-- Сборка -->
    <text x="56" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#7A7266">СБОРКА · 1–2 ЧАСА, МОЖНО С ПЕРЕРЫВАМИ</text>

    <g id="build-stages">
      <g transform="translate(56 148)">
        <rect width="204" height="158" rx="16" fill="#FFFDF8" stroke="#D8CFBF" stroke-width="2"/>
        <text x="20" y="50" font-size="38" font-weight="700" fill="#2B4C7E">0</text>
        <text x="20" y="92" font-size="24" font-weight="700" fill="#1E1B16">Старт</text>
        <text x="20" y="122" font-size="18" fill="#7A7266">тема, папка,</text>
        <text x="20" y="144" font-size="18" fill="#7A7266">поиск</text>
      </g>
      <g transform="translate(278 148)">
        <rect width="204" height="158" rx="16" fill="#FFFDF8" stroke="#D8CFBF" stroke-width="2"/>
        <text x="20" y="50" font-size="38" font-weight="700" fill="#2B4C7E">1</text>
        <text x="20" y="92" font-size="24" font-weight="700" fill="#1E1B16">Интервью</text>
        <text x="20" y="122" font-size="18" fill="#7A7266">цель, уровень,</text>
        <text x="20" y="144" font-size="18" fill="#7A7266">барьер</text>
      </g>
      <g transform="translate(500 148)">
        <rect width="204" height="158" rx="16" fill="#FFFDF8" stroke="#D9622B" stroke-width="3"/>
        <text x="20" y="50" font-size="38" font-weight="700" fill="#D9622B">2</text>
        <text x="20" y="92" font-size="24" font-weight="700" fill="#1E1B16">Источники</text>
        <text x="20" y="122" font-size="18" fill="#2B4C7E">канон</text>
        <text x="74" y="122" font-size="18" fill="#7A7266">+</text>
        <text x="92" y="122" font-size="18" fill="#D9622B">поле</text>
        <text x="20" y="144" font-size="18" fill="#7A7266">банк семян</text>
      </g>
      <g transform="translate(722 148)">
        <rect width="204" height="158" rx="16" fill="#FFFDF8" stroke="#D8CFBF" stroke-width="2"/>
        <text x="20" y="50" font-size="38" font-weight="700" fill="#2B4C7E">3</text>
        <text x="20" y="92" font-size="24" font-weight="700" fill="#1E1B16">Программа</text>
        <text x="20" y="122" font-size="18" fill="#7A7266">модули, кейс,</text>
        <text x="20" y="144" font-size="18" fill="#7A7266">упражнения</text>
      </g>
      <g transform="translate(944 148)">
        <rect width="204" height="158" rx="16" fill="#FFFDF8" stroke="#D8CFBF" stroke-width="2"/>
        <text x="20" y="50" font-size="38" font-weight="700" fill="#2B4C7E">4</text>
        <text x="20" y="92" font-size="24" font-weight="700" fill="#1E1B16">Блокнот</text>
        <text x="20" y="122" font-size="18" fill="#7A7266">NotebookLM,</text>
        <text x="20" y="144" font-size="18" fill="#7A7266">первый урок</text>
      </g>
      <g fill="#1E1B16">
        <path d="M262 221 l12 6 l-12 6 z"/>
        <path d="M484 221 l12 6 l-12 6 z"/>
        <path d="M706 221 l12 6 l-12 6 z"/>
        <path d="M928 221 l12 6 l-12 6 z"/>
      </g>
    </g>

    <!-- Учёба -->
    <text x="56" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#7A7266">УЧЁБА · КАЖДАЯ СЕССИЯ</text>

    <g id="learning-loop" font-size="20" font-weight="600" text-anchor="middle">
      <rect x="56" y="390" width="168" height="62" rx="31" fill="#1E1B16"/>
      <text x="140" y="428" fill="#F6F1E7">Повторы</text>
      <rect x="240" y="390" width="168" height="62" rx="31" fill="#FFFDF8" stroke="#1E1B16" stroke-width="2"/>
      <text x="324" y="428" fill="#1E1B16">Попытка</text>
      <rect x="424" y="390" width="168" height="62" rx="31" fill="#FFFDF8" stroke="#2B4C7E" stroke-width="2"/>
      <text x="508" y="428" fill="#2B4C7E">Теория</text>
      <rect x="608" y="390" width="168" height="62" rx="31" fill="#FFFDF8" stroke="#D9622B" stroke-width="2"/>
      <text x="692" y="428" fill="#D9622B">Практика</text>
      <rect x="792" y="390" width="168" height="62" rx="31" fill="#FFFDF8" stroke="#1E1B16" stroke-width="2"/>
      <text x="876" y="428" fill="#1E1B16">Разбор</text>
      <rect x="976" y="390" width="168" height="62" rx="31" fill="#FFFDF8" stroke="#1E1B16" stroke-width="2"/>
      <text x="1060" y="428" fill="#1E1B16">Припоминание</text>
    </g>

    <path d="M1060 452 V496 H140 V466" stroke="#7A7266" stroke-width="3" fill="none" stroke-dasharray="8 7"/>
    <path d="M132 470 l8 -14 l8 14 z" fill="#7A7266"/>
    <rect x="430" y="482" width="340" height="28" fill="#F6F1E7"/>
    <text x="600" y="503" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7A7266">вопросы → очередь повторов</text>

    <text x="600" y="566" text-anchor="middle" font-size="22" fill="#1E1B16">сдача · защита · тест раз в 3 недели · <tspan fill="#D9622B">обнови поле</tspan> · ретро</text>
  </g>
</svg>
